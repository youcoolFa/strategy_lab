# 對應 demo/demo_weekend_phase1.py 的手動組裝版本,進出場/時間窗參數完全一致。
# 下單數量(qty)不在這裡設定——那是「怎麼下單」的資料,由
# demo/sandbox_order.yaml(沙盒)或 live_execution_config.yaml(真實執行)
# 的 position_sizing 決定,見 dsl/order_config.py。
name: weekend_mean_reversion
symbol: BTC/USDT

entry:
  type: deviation_from_reference
  params:
    deviation_pct: 0.75

exit:
  type: return_to_reference
  params: {}

time_window:
  type: weekly_window
  params:
    start_weekday: 5
    start_time: "04:00"
    end_weekday: 0
    end_time: "06:00"
    cleanup_buffer_minutes: 5
