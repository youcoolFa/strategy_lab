# 對應 demo/demo_weekend_phase1.py 的手動組裝版本,參數完全一致。
name: weekend_mean_reversion
symbol: BTC/USDT
order_qty: 1.0

entry:
  type: deviation_from_reference
  params:
    deviation_pct: 0.75

exit:
  type: return_to_reference
  params: {}

time_window:
  type: weekly_window
  params:
    start_weekday: 5
    start_time: "04:00"
    end_weekday: 0
    end_time: "06:00"
    cleanup_buffer_minutes: 5
