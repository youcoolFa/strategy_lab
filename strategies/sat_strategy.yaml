# 週末區間策略(sat_strategy;2026-10-17 改成「各自回到起點平倉」,engine/band_runner.py):long、short 都有。
#
#   1. 啟動時決定 origin(live_execution_config.yaml 的 origin_price 有填就用手動值,沒填用啟動當下價格),
#      上下各掛一張進場限價單:
#        買(做多) = origin × (1 − buy_pct%)      賣(做空) = origin × (1 + sell_pct%)
#   2. 哪一邊的進場單成交,就立刻在 origin 掛反向的平倉限價單(reduce_only);另一邊的進場單繼續掛著
#   3. 平倉單成交後,把這一邊的進場單補回去,回到最初狀態(兩邊進場單都掛著);一直循環,沒有次數上限
#   4. 時間窗結束(週一 06:00 前 cleanup_buffer_minutes 分鐘):取消所有掛單、市價平倉
#
# 例(origin 100、buy_pct 0.5、sell_pct 1.5、數量 1):
#   開始:        買 99.5 ×1、賣 101.5 ×1                         持倉 0
#   跌到 99.5:   買單成交 → 立刻在 100 掛平倉賣單(賣 101.5 的進場單還掛著)   持倉 +1
#   回到 100:    平倉賣單成交(賺 0.5)→ 把買 99.5 的進場單補回去  持倉 0(回到開始的狀態)
#   漲到 101.5:  賣單成交(做空)→ 立刻在 100 掛平倉買單          持倉 −1
#   回到 100:    平倉買單成交(賺 1.5)→ 把賣 101.5 的進場單補回去 持倉 0
# 同一時間最多一筆持倉(要走到另一邊的進場價,價格一定先經過 origin、平倉單先成交);價格往不利方向走、
# 一直回不到 origin 就一直虧(沒有停損),到收尾時市價平倉。
#
# 進場單不是 reduceOnly,平倉單是 reduceOnly。不支援「接手現有持倉」;只能用 order_type: limit。
# 數量見 live_execution_config.yaml 的 position_sizing(每張單的數量)。這個策略沒有回測過。
name: sat_strategy
symbol: BTC/USDT
direction: both   # 區間策略固定 both(上下同時掛單)
loop: null   # 區間策略固定 null:一直做到時間窗結束
scale_in: false   # 分注策略才是 true(見 strategies/scale_in_ladder.yaml)
band: true   # 區間策略(engine/band_runner.py)

entry:
  type: band
  params:
    buy_pct: 0.1    # 買單:origin 往下多少 %
    sell_pct: 0.1   # 賣單:origin 往上多少 %

exit:
  type: band   # 區間策略沒有獨立的平倉價:對面那張補單就是平倉
  params: {}

time_window:
  type: weekly_window
  params:
    start_weekday: 5   # 5 = 星期六(星期一 = 0)HKT
    start_time: "04:00"
    end_weekday: 0     # 0 = 星期一 HKT
    end_time: "06:00"
    cleanup_buffer_minutes: 5
