# 對應 demo/demo_crossover_phase1.py 的手動組裝版本,進出場/時間窗參數完全一致。
# 下單數量(qty)不在這裡設定,見 dsl/order_config.py。
name: ma_crossover_bracket
symbol: BTC/USDT

entry:
  type: ma_crossover
  params:
    fast_window: 5
    slow_window: 20

exit:
  type: bracket_tp_sl
  params:
    take_profit_pct: 1.0
    stop_loss_pct: 0.5

time_window:
  type: daily_session
  params:
    start_time: "09:00"
    end_time: "17:00"
    cleanup_buffer_minutes: 2
