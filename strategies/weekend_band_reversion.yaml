# 週末區間策略(2026-10-10 改版,engine/band_runner.py):long、short 同時進行。
#
#   1. 啟動時決定 origin(live_execution_config.yaml 的 origin_price 有填就用手動值,沒填用啟動當下價格),
#      上下各掛一張限價單:
#        買 = origin × (1 − buy_pct%)      賣 = origin × (1 + sell_pct%)
#   2. 其中一張成交,就在**對面價位**補一張同數量的單
#   3. 一直循環,直到時間窗結束(週一 06:00 前 cleanup_buffer_minutes 分鐘):取消所有掛單、市價平倉
#
# 例(origin 100、buy_pct / sell_pct 都是 0.1、數量 1):
#   開始:      買 99.9 ×1、賣 100.1 ×1                          持倉 0
#   跌到 99.9: 買單成交 → 對面補一張賣單(100.1 共 2 張)         持倉 +1
#   漲到 100.1:2 張賣單成交 = 平掉多單(賺 0.2)+ 開空單          持倉 −1(99.9 共 2 張買單)
#   跌到 99.9: 2 張買單成交 = 平掉空單(賺 0.2)+ 開多單          持倉 +1 …
# 第一張成交後持倉一直在 ±1 之間切換,每次穿過整個區間賺一次價差;價格突破區間不回來就一直虧
# (沒有停損),到收尾時市價平倉。
#
# Bybit 單向持倉:買賣單是淨部位的加減,所以每張單都不是 reduceOnly。
# 不支援「接手現有持倉」;只能用 order_type: limit。數量見 live_execution_config.yaml 的 position_sizing
# (每張單的數量)。這個策略沒有回測過。
name: weekend_band_reversion
symbol: BTC/USDT
direction: both   # 區間策略固定 both(上下同時掛單)
loop: null   # 區間策略固定 null:一直做到時間窗結束
scale_in: false   # 分注策略才是 true(見 strategies/scale_in_ladder.yaml)
band: true   # 區間策略(engine/band_runner.py)

entry:
  type: band
  params:
    buy_pct: 0.1    # 買單:origin 往下多少 %
    sell_pct: 0.1   # 賣單:origin 往上多少 %

exit:
  type: band   # 區間策略沒有獨立的平倉價:對面那張補單就是平倉
  params: {}

time_window:
  type: weekly_window
  params:
    start_weekday: 5   # 5 = 星期六(星期一 = 0)HKT
    start_time: "04:00"
    end_weekday: 0     # 0 = 星期一 HKT
    end_time: "06:00"
    cleanup_buffer_minutes: 5
