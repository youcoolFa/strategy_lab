<svg viewBox="0 0 1600 850" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#607d8b" />
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9575cd" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="850" fill="#ffffff" />
  <text x="30" y="34" font-size="18" font-weight="700" fill="#263238">strategy_lab 模組關係圖</text>
  <text x="30" y="54" font-size="12" fill="#78909c">對應 docs/ARCHITECTURE.md §1 ・ 虛線=實作 Protocol、實線灰=呼叫/使用、實線藍=registry 查找、實線紫=組裝/建構</text>

  <!-- band backgrounds -->
  <rect x="40" y="90" width="1000" height="90" rx="10" fill="#eef0fb" />
  <text x="60" y="108" font-size="12" font-weight="700" fill="#3949ab">合約層(interfaces.py / registry.py)</text>

  <rect x="40" y="200" width="560" height="160" rx="10" fill="#eaf2fd" />
  <text x="60" y="218" font-size="12" font-weight="700" fill="#1e88e5">Rule 層(Phase 2)</text>

  <rect x="1060" y="200" width="340" height="160" rx="10" fill="#e6f5f3" />
  <text x="1075" y="218" font-size="12" font-weight="700" fill="#00897b">DSL 層(Phase 3)</text>

  <rect x="40" y="380" width="1000" height="170" rx="10" fill="#eaf7ea" />
  <text x="60" y="398" font-size="12" font-weight="700" fill="#2e7d32">Plugin 層(策略邏輯,彼此不互相依賴)</text>

  <!-- Contract layer boxes -->
  <rect x="330" y="115" width="360" height="55" rx="8" fill="#ffffff" stroke="#3949ab" stroke-width="1.5" />
  <text x="510" y="135" font-size="12.5" font-weight="700" text-anchor="middle" fill="#283593">interfaces.py</text>
  <text x="510" y="152" font-size="10.5" text-anchor="middle" fill="#3949ab">EntrySignal・ExitSignal・TimeWindow・Broker・KillSwitch(Protocol)</text>

  <rect x="730" y="115" width="280" height="55" rx="8" fill="#ffffff" stroke="#3949ab" stroke-width="1.5" />
  <text x="870" y="135" font-size="12.5" font-weight="700" text-anchor="middle" fill="#283593">registry.py</text>
  <text x="870" y="152" font-size="10.5" text-anchor="middle" fill="#3949ab">dict 註冊表 (kind, name) → class</text>

  <!-- Yaml box -->
  <rect x="1060" y="115" width="260" height="55" rx="8" fill="#ffffff" stroke="#616161" stroke-width="1.5" />
  <text x="1190" y="135" font-size="12.5" font-weight="700" text-anchor="middle" fill="#424242">strategies/*.yaml</text>
  <text x="1190" y="152" font-size="10.5" text-anchor="middle" fill="#616161">策略定義(純資料,不含邏輯)</text>

  <!-- Rule layer boxes -->
  <rect x="70" y="232" width="230" height="45" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="1.5" />
  <text x="185" y="259" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0">rules/base.py（Condition Protocol）</text>

  <rect x="70" y="290" width="230" height="55" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="1.5" />
  <text x="185" y="311" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0">rules/conditions.py</text>
  <text x="185" y="328" font-size="10" text-anchor="middle" fill="#1e88e5">PriceBelowReference 等具體條件</text>

  <rect x="330" y="290" width="230" height="55" rx="8" fill="#ffffff" stroke="#1e88e5" stroke-width="1.5" />
  <text x="445" y="311" font-size="12" font-weight="700" text-anchor="middle" fill="#1565c0">rules/composite.py</text>
  <text x="445" y="328" font-size="10" text-anchor="middle" fill="#1e88e5">And ・ Or ・ Not</text>

  <!-- DSL layer boxes -->
  <rect x="1080" y="232" width="300" height="50" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5" />
  <text x="1230" y="252" font-size="12" font-weight="700" text-anchor="middle" fill="#00695c">dsl/schema.py</text>
  <text x="1230" y="268" font-size="10" text-anchor="middle" fill="#00897b">pydantic StrategyDefinition・PluginSpec</text>

  <rect x="1080" y="295" width="300" height="55" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="1.5" />
  <text x="1230" y="316" font-size="12" font-weight="700" text-anchor="middle" fill="#00695c">dsl/loader.py</text>
  <text x="1230" y="333" font-size="10" text-anchor="middle" fill="#00897b">load_strategy(path) → ComposedStrategy</text>

  <!-- Plugin boxes row1 -->
  <rect x="70" y="410" width="225" height="50" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5" />
  <text x="182" y="431" font-size="11" font-weight="700" text-anchor="middle" fill="#2e7d32">entry/</text>
  <text x="182" y="447" font-size="10.5" text-anchor="middle" fill="#388e3c">deviation_from_reference.py</text>

  <rect x="310" y="410" width="225" height="50" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5" />
  <text x="422" y="431" font-size="11" font-weight="700" text-anchor="middle" fill="#2e7d32">entry/</text>
  <text x="422" y="447" font-size="10.5" text-anchor="middle" fill="#388e3c">ma_crossover.py</text>

  <rect x="550" y="410" width="225" height="50" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5" />
  <text x="662" y="431" font-size="11" font-weight="700" text-anchor="middle" fill="#2e7d32">exit/</text>
  <text x="662" y="447" font-size="10.5" text-anchor="middle" fill="#388e3c">return_to_reference.py</text>

  <rect x="790" y="410" width="225" height="50" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5" />
  <text x="902" y="431" font-size="11" font-weight="700" text-anchor="middle" fill="#2e7d32">exit/</text>
  <text x="902" y="447" font-size="10.5" text-anchor="middle" fill="#388e3c">bracket_tp_sl.py</text>

  <!-- Plugin boxes row2 -->
  <rect x="70" y="475" width="225" height="50" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5" />
  <text x="182" y="496" font-size="11" font-weight="700" text-anchor="middle" fill="#2e7d32">exit/</text>
  <text x="182" y="512" font-size="10.5" text-anchor="middle" fill="#388e3c">max_hold_duration.py</text>

  <rect x="310" y="475" width="225" height="50" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5" />
  <text x="422" y="496" font-size="11" font-weight="700" text-anchor="middle" fill="#2e7d32">time_window/</text>
  <text x="422" y="512" font-size="10.5" text-anchor="middle" fill="#388e3c">weekly_window.py</text>

  <rect x="550" y="475" width="225" height="50" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5" />
  <text x="662" y="496" font-size="11" font-weight="700" text-anchor="middle" fill="#2e7d32">time_window/</text>
  <text x="662" y="512" font-size="10.5" text-anchor="middle" fill="#388e3c">daily_session.py</text>

  <rect x="790" y="475" width="225" height="50" rx="8" fill="#ffffff" stroke="#43a047" stroke-width="1.5" />
  <text x="902" y="496" font-size="11" font-weight="700" text-anchor="middle" fill="#2e7d32">kill_switch/</text>
  <text x="902" y="512" font-size="10.5" text-anchor="middle" fill="#388e3c">sustained_breakout.py</text>

  <!-- Demo box -->
  <rect x="1060" y="395" width="300" height="140" rx="8" fill="#ffffff" stroke="#616161" stroke-width="1.5" />
  <text x="1210" y="425" font-size="12.5" font-weight="700" text-anchor="middle" fill="#424242">demo/*.py</text>
  <text x="1210" y="443" font-size="12.5" font-weight="700" text-anchor="middle" fill="#424242">demo/run_from_yaml.py</text>
  <text x="1210" y="465" font-size="10.5" text-anchor="middle" fill="#616161">策略組裝入口</text>
  <text x="1210" y="483" font-size="10" text-anchor="middle" fill="#757575">(前三者手動 import plugin</text>
  <text x="1210" y="498" font-size="10" text-anchor="middle" fill="#757575">run_from_yaml.py 透過 loader)</text>

  <!-- Sim boxes -->
  <rect x="70" y="580" width="260" height="55" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="1.5" />
  <text x="200" y="601" font-size="12" font-weight="700" text-anchor="middle" fill="#ef6c00">broker/paper_broker.py</text>
  <text x="200" y="618" font-size="10.5" text-anchor="middle" fill="#fb8c00">PaperBroker(模擬掛單/成交)</text>

  <rect x="70" y="650" width="260" height="55" rx="8" fill="#ffffff" stroke="#fb8c00" stroke-width="1.5" />
  <text x="200" y="671" font-size="12" font-weight="700" text-anchor="middle" fill="#ef6c00">broker/synthetic_feed.py</text>
  <text x="200" y="688" font-size="10.5" text-anchor="middle" fill="#fb8c00">SyntheticFeed(合成價格序列)</text>

  <!-- Core box -->
  <rect x="460" y="590" width="320" height="85" rx="10" fill="#fff5f5" stroke="#e53935" stroke-width="2" />
  <text x="620" y="622" font-size="13.5" font-weight="700" text-anchor="middle" fill="#c62828">engine/runner.py</text>
  <text x="620" y="641" font-size="11" text-anchor="middle" fill="#e53935">StrategyRunner(狀態機)</text>
  <text x="620" y="658" font-size="10" text-anchor="middle" fill="#ef5350">唯一同時依賴合約層與模擬交易所的元件</text>

  <!-- ===== edges ===== -->
  <g stroke-width="1.5" fill="none">
    <!-- E1 plugin -> interfaces (dashed, 實作) -->
    <path d="M870,380 L870,178 L650,178 L650,170" stroke="#9575cd" stroke-dasharray="5,4" marker-end="url(#arrowDash)" />
    <text x="878" y="260" font-size="10" fill="#7e57c2">實作(8 個 plugin 共用)</text>

    <!-- E2 plugin -> registry (dashed, @register) -->
    <path d="M950,380 L950,170" stroke="#9575cd" stroke-dasharray="5,4" marker-end="url(#arrowDash)" />
    <text x="956" y="280" font-size="10" fill="#7e57c2">@register</text>

    <!-- E3 PaperBroker -> interfaces (dashed, 實作 Broker) -->
    <path d="M70,605 L20,605 L20,142 L330,142" stroke="#9575cd" stroke-dasharray="5,4" marker-end="url(#arrowDash)" />
    <text x="26" y="400" font-size="10" fill="#7e57c2" transform="rotate(-90 26 400)">實作 Broker(結構相符,零修改)</text>

    <!-- E4 conditions -> base -->
    <path d="M185,290 L185,277" stroke="#90a4ae" marker-end="url(#arrow2)" />
    <!-- E5 composite -> base -->
    <path d="M445,290 L445,260 L300,260" stroke="#90a4ae" marker-end="url(#arrow2)" />
    <!-- E6 conditions -> composite -->
    <path d="M300,317 L330,317" stroke="#90a4ae" marker-end="url(#arrow2)" />
    <text x="188" y="285" font-size="9" fill="#78909c">實作</text>
    <text x="303" y="312" font-size="9" fill="#78909c">組合子條件</text>

    <!-- E7 rule layer -> plugin layer -->
    <path d="M185,345 L185,380" stroke="#607d8b" marker-end="url(#arrow2)" />
    <path d="M445,345 L445,380" stroke="#607d8b" marker-end="url(#arrow2)" />
    <text x="200" y="368" font-size="9.5" fill="#455a64">__post_init__ 組出 self.rule</text>

    <!-- E8 yaml -> loader -->
    <path d="M1075,170 L1075,322 L1080,322" stroke="#607d8b" marker-end="url(#arrow2)" />
    <text x="1005" y="240" font-size="9.5" fill="#455a64">yaml.safe_load</text>

    <!-- E9 schema -> loader -->
    <path d="M1230,282 L1230,295" stroke="#607d8b" marker-end="url(#arrow2)" />

    <!-- E10 registry -> loader -->
    <path d="M1010,142 L1040,142 L1040,322 L1080,322" stroke="#1e88e5" marker-end="url(#arrow2)" />
    <text x="1013" y="200" font-size="9.5" fill="#1565c0">registry.get(kind,type)</text>

    <!-- E11 loader -> demo -->
    <path d="M1380,322 L1420,322 L1420,465 L1360,465" stroke="#7e57c2" marker-end="url(#arrow2)" />
    <text x="1426" y="400" font-size="9.5" fill="#5e35b1">class(**params)</text>

    <!-- E12 synthetic feed -> demo -->
    <path d="M330,677 L360,677 L360,760 L1210,760 L1210,535" stroke="#607d8b" marker-end="url(#arrow2)" />
    <text x="700" y="775" font-size="9.5" fill="#455a64">next(feed) 提供價格</text>

    <!-- E13 demo -> runner -->
    <path d="M1100,535 L1100,560 L700,560 L700,590" stroke="#7e57c2" marker-end="url(#arrow2)" />
    <text x="720" y="575" font-size="9.5" fill="#5e35b1">組裝 entry/exit/time_window/kill_switch,建構 StrategyRunner</text>

    <!-- E14 runner -> plugin layer (evaluate) -->
    <path d="M620,590 L620,550" stroke="#607d8b" marker-end="url(#arrow2)" />
    <text x="628" y="575" font-size="9.5" fill="#455a64">rule.evaluate(ctx) / 價格計算</text>

    <!-- E15 runner -> PaperBroker -->
    <path d="M460,615 L330,615" stroke="#607d8b" marker-end="url(#arrow2)" />
    <text x="335" y="609" font-size="9.5" fill="#455a64">place_limit_* / fetch_order / tick</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#455a64">
    <line x1="30" y1="775" x2="70" y2="775" stroke="#9575cd" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)" />
    <text x="80" y="779">實作 Protocol</text>

    <line x1="220" y1="775" x2="260" y2="775" stroke="#607d8b" stroke-width="1.5" marker-end="url(#arrow2)" />
    <text x="270" y="779">呼叫 / 使用</text>

    <line x1="400" y1="775" x2="440" y2="775" stroke="#1e88e5" stroke-width="1.5" marker-end="url(#arrow2)" />
    <text x="450" y="779">registry 查找</text>

    <line x1="600" y1="775" x2="640" y2="775" stroke="#7e57c2" stroke-width="1.5" marker-end="url(#arrow2)" />
    <text x="650" y="779">組裝 / 建構</text>
  </g>
  <text x="30" y="805" font-size="10.5" fill="#90a4ae">Rule 層(Phase 2)不依賴 Plugin 層或 registry;Plugin 層彼此互不依賴,也不依賴 engine/runner.py;runner.py 只認合約層,完全不知道 Rule 層/DSL 層存在。</text>
</svg>
