<svg viewBox="0 0 900 1080" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#607d8b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1080" fill="#ffffff" />

  <text x="30" y="34" font-size="18" font-weight="700" fill="#263238">strategy_lab Live 遷移工程路線圖</text>
  <text x="30" y="54" font-size="12" fill="#78909c">對應 docs/ARCHITECTURE.md §6 ・ 產生於 2026-09-24</text>

  <!-- start ellipse -->
  <ellipse cx="440" cy="98" rx="140" ry="30" fill="#d8e0fb" stroke="#7b8fd1" stroke-width="1.5" />
  <text x="440" y="103" font-size="14" font-weight="700" text-anchor="middle" fill="#2b3a7a">strategy_lab Live 遷移</text>

  <!-- Stage 1 -->
  <rect x="280" y="150" width="320" height="52" rx="10" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5" />
  <text x="440" y="171" font-size="13" font-weight="700" text-anchor="middle" fill="#1b5e20">Stage 1｜account_feed / market_feed</text>
  <text x="440" y="189" font-size="11" text-anchor="middle" fill="#2e7d32">移植自 sat_strategy，接 Fa_Successful_trade Redis</text>

  <!-- Stage 2 -->
  <rect x="280" y="232" width="320" height="52" rx="10" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5" />
  <text x="440" y="253" font-size="13" font-weight="700" text-anchor="middle" fill="#1b5e20">Stage 2｜bybit_client.py</text>
  <text x="440" y="271" font-size="11" text-anchor="middle" fill="#2e7d32">pybit 原生 API，取代 ccxt</text>

  <!-- Step 1 -->
  <rect x="280" y="314" width="320" height="46" rx="10" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5" />
  <text x="440" y="342" font-size="13" font-weight="700" text-anchor="middle" fill="#1b5e20">1. 泛化 Broker / OrderLike Protocol</text>

  <!-- Step 2 -->
  <rect x="280" y="386" width="320" height="46" rx="10" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5" />
  <text x="440" y="414" font-size="13" font-weight="700" text-anchor="middle" fill="#1b5e20">2. LiveBroker 包裝 BybitClient</text>

  <!-- Step 3 -->
  <rect x="280" y="458" width="320" height="52" rx="10" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5" />
  <text x="440" y="479" font-size="13" font-weight="700" text-anchor="middle" fill="#1b5e20">3. dry_run 安全開關</text>
  <text x="440" y="497" font-size="11" text-anchor="middle" fill="#2e7d32">預設 True，卡住真實下單前的最後一道保護</text>

  <!-- left detail cluster for Step 3 -->
  <rect x="20" y="440" width="180" height="30" rx="6" fill="#fafafa" stroke="#bdbdbd" />
  <text x="110" y="459" font-size="11" text-anchor="middle" fill="#555">BybitClient.testnet=True</text>

  <rect x="20" y="480" width="180" height="30" rx="6" fill="#fafafa" stroke="#bdbdbd" />
  <text x="110" y="499" font-size="11" text-anchor="middle" fill="#555">LiveBroker.dry_run=True</text>

  <rect x="20" y="520" width="180" height="30" rx="6" fill="#fafafa" stroke="#bdbdbd" />
  <text x="110" y="539" font-size="11" text-anchor="middle" fill="#555">risky 值只能使用者自己設</text>

  <rect x="222" y="468" width="72" height="34" rx="6" fill="#f5f5f5" stroke="#9e9e9e" />
  <text x="258" y="489" font-size="10" text-anchor="middle" fill="#555">安全預設</text>

  <path d="M200,455 L222,483" fill="none" stroke="#9e9e9e" />
  <path d="M200,495 L222,487" fill="none" stroke="#9e9e9e" />
  <path d="M200,535 L222,492" fill="none" stroke="#9e9e9e" />
  <path d="M294,485 L280,484" fill="none" stroke="#9e9e9e" marker-end="url(#arrow)" />

  <!-- split into Step4 / Step5 -->
  <rect x="120" y="592" width="300" height="60" rx="10" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5" />
  <text x="270" y="614" font-size="13" font-weight="700" text-anchor="middle" fill="#795548">4. .env 真實憑證載入</text>
  <text x="270" y="631" font-size="10.5" text-anchor="middle" fill="#795548">程式碼完成，真實 .env 尚不存在</text>

  <rect x="460" y="592" width="300" height="60" rx="10" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5" />
  <text x="610" y="614" font-size="13" font-weight="700" text-anchor="middle" fill="#795548">5. live/main.py 執行入口</text>
  <text x="610" y="631" font-size="10.5" text-anchor="middle" fill="#795548">+ request_stop()，main() 從未真的執行過</text>

  <!-- yellow key-input accent box -->
  <rect x="270" y="694" width="340" height="58" rx="10" fill="#ffe0b2" stroke="#e65100" stroke-width="1.5" />
  <text x="440" y="717" font-size="13" font-weight="700" text-anchor="middle" fill="#bf360c">真實 mainnet 小額測試帳戶 Key</text>
  <text x="440" y="735" font-size="11" text-anchor="middle" fill="#bf360c">使用者提供・預計 2026-09-25</text>

  <!-- Step 6 -->
  <rect x="280" y="782" width="320" height="52" rx="10" fill="#ffe0b2" stroke="#e65100" stroke-width="1.5" />
  <text x="440" y="803" font-size="13" font-weight="700" text-anchor="middle" fill="#bf360c">6. 小額帳戶完整跑一次</text>
  <text x="440" y="821" font-size="11" text-anchor="middle" fill="#bf360c">使用者決定跳過 testnet，直接用真實帳戶</text>

  <!-- right detail cluster for Step 6 -->
  <rect x="660" y="764" width="200" height="28" rx="6" fill="#fafafa" stroke="#bdbdbd" />
  <text x="760" y="782" font-size="11" text-anchor="middle" fill="#555">帳戶查詢</text>

  <rect x="660" y="800" width="200" height="28" rx="6" fill="#fafafa" stroke="#bdbdbd" />
  <text x="760" y="818" font-size="11" text-anchor="middle" fill="#555">行情訂閱</text>

  <rect x="660" y="836" width="200" height="28" rx="6" fill="#fafafa" stroke="#bdbdbd" />
  <text x="760" y="854" font-size="11" text-anchor="middle" fill="#555">下單邏輯驗證(dry_run=True 先行)</text>

  <path d="M600,778 L660,778" fill="none" stroke="#9e9e9e" marker-end="url(#arrow)" />
  <path d="M600,808 L660,814" fill="none" stroke="#9e9e9e" marker-end="url(#arrow)" />
  <path d="M600,822 L660,850" fill="none" stroke="#9e9e9e" marker-end="url(#arrow)" />

  <!-- Step 7 -->
  <rect x="280" y="896" width="320" height="50" rx="10" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1.5" />
  <text x="440" y="917" font-size="13" font-weight="700" text-anchor="middle" fill="#616161">7. launchd + monitor.py + notifier.py</text>
  <text x="440" y="934" font-size="11" text-anchor="middle" fill="#757575">優先度較低，不影響能不能下單</text>

  <!-- main spine arrows -->
  <path d="M440,128 L440,150" fill="none" stroke="#607d8b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M440,202 L440,232" fill="none" stroke="#607d8b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M440,284 L440,314" fill="none" stroke="#607d8b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M440,360 L440,386" fill="none" stroke="#607d8b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M440,432 L440,458" fill="none" stroke="#607d8b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- split arrows Step3 -> Step4/Step5 -->
  <path d="M440,510 L440,540 L270,540 L270,592" fill="none" stroke="#607d8b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M440,510 L440,540 L610,540 L610,592" fill="none" stroke="#607d8b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- merge arrows Step4/Step5 -> key box -->
  <path d="M270,652 L270,672 L440,672 L440,694" fill="none" stroke="#607d8b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M610,652 L610,672 L440,672 L440,694" fill="none" stroke="#607d8b" stroke-width="1.5" marker-end="url(#arrow)" />

  <path d="M440,752 L440,782" fill="none" stroke="#607d8b" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M440,834 L440,896" fill="none" stroke="#607d8b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- legend -->
  <g font-size="11" fill="#455a64">
    <rect x="30" y="980" width="16" height="16" rx="3" fill="#c8e6c9" stroke="#2e7d32" />
    <text x="52" y="992">已完成並驗證過真實路徑</text>

    <rect x="230" y="980" width="16" height="16" rx="3" fill="#fff9c4" stroke="#f9a825" />
    <text x="252" y="992">程式碼完成，還沒碰過真實帳戶</text>

    <rect x="460" y="980" width="16" height="16" rx="3" fill="#ffe0b2" stroke="#e65100" />
    <text x="482" y="992">卡在等真實憑證</text>

    <rect x="630" y="980" width="16" height="16" rx="3" fill="#eeeeee" stroke="#9e9e9e" />
    <text x="652" y="992">尚未開始（優先度較低）</text>
  </g>

  <text x="30" y="1030" font-size="10.5" fill="#90a4ae">灰框小方塊＝補充細節／驗證項目，不是主流程節點</text>
</svg>
