<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif">
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f" />
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#90a4ae" />
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7e57c2" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff" />
  <text x="30" y="28" font-size="16" font-weight="700" fill="#263238">rule 與 runner 的關係（未放入 project，僅供說明）</text>
  <text x="30" y="46" font-size="11.5" fill="#78909c">以 DeviationFromReferenceEntry 為例：一次建構、之後每個 tick 都重新問一次同一個 rule 物件</text>

  <!-- lifeline headers -->
  <rect x="60" y="60" width="220" height="40" rx="6" fill="#eceff1" stroke="#607d8b" />
  <text x="170" y="85" font-size="12.5" font-weight="700" text-anchor="middle" fill="#37474f">demo/*.py（呼叫者）</text>

  <rect x="420" y="60" width="240" height="40" rx="6" fill="#fff5f5" stroke="#e53935" />
  <text x="540" y="85" font-size="12.5" font-weight="700" text-anchor="middle" fill="#c62828">StrategyRunner</text>

  <rect x="780" y="60" width="220" height="40" rx="6" fill="#eaf7ea" stroke="#43a047" />
  <text x="890" y="85" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2e7d32">plugin（entry）</text>

  <rect x="1120" y="60" width="220" height="40" rx="6" fill="#eaf2fd" stroke="#1e88e5" />
  <text x="1230" y="85" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1565c0">plugin.rule（Condition）</text>

  <!-- lifelines -->
  <line x1="170" y1="100" x2="170" y2="960" stroke="#b0bec5" stroke-dasharray="3,4" />
  <line x1="540" y1="100" x2="540" y2="960" stroke="#e57373" stroke-dasharray="3,4" />
  <line x1="890" y1="100" x2="890" y2="960" stroke="#81c784" stroke-dasharray="3,4" />
  <line x1="1230" y1="100" x2="1230" y2="960" stroke="#64b5f6" stroke-dasharray="3,4" />

  <!-- Phase 0: construction -->
  <rect x="700" y="120" width="650" height="80" rx="8" fill="#f3e5f5" stroke="#9575cd" stroke-width="1.5" stroke-dasharray="5,3" />
  <text x="1025" y="140" font-size="11" font-weight="700" text-anchor="middle" fill="#5e35b1">建構階段（只發生一次，在物件建好的當下）</text>
  <path d="M890,160 L1230,160" stroke="#7e57c2" stroke-width="1.5" marker-end="url(#dot)" />
  <text x="1025" y="180" font-size="10.5" text-anchor="middle" fill="#5e35b1">__post_init__： self.rule = PriceBelowReference(0.75)</text>

  <text x="700" y="230" font-size="11" fill="#90a4ae" text-anchor="middle">━━━━━━━━━━ 執行階段：runner 每次 tick() 都重跑一次下面這段 ━━━━━━━━━━</text>

  <!-- Tick #1 -->
  <text x="60" y="270" font-size="11.5" font-weight="700" fill="#c62828">tick #1</text>

  <path d="M170,285 L540,285" stroke="#37474f" stroke-width="1.5" marker-end="url(#call)" />
  <text x="180" y="278" font-size="10.5" fill="#37474f">① runner.tick(now, price)</text>

  <rect x="540" y="300" width="260" height="26" rx="4" fill="#fff5f5" stroke="#ef9a9a" />
  <text x="545" y="317" font-size="10" fill="#c62828">② 組出 ctx = StrategyContext(now, price, …)</text>

  <path d="M540,355 L890,355" stroke="#7e57c2" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dot)" />
  <text x="600" y="348" font-size="10" fill="#7e57c2">③ 讀 entry.rule 這個屬性</text>
  <path d="M890,375 L1230,375" stroke="#37474f" stroke-width="1.5" marker-end="url(#call)" />
  <text x="940" y="368" font-size="10" fill="#37474f">④ .evaluate(ctx)</text>

  <path d="M1230,405 L540,405" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ret)" />
  <text x="700" y="398" font-size="10" fill="#607d8b">⑤ return False</text>

  <rect x="540" y="420" width="320" height="26" rx="4" fill="#fff5f5" stroke="#ef9a9a" />
  <text x="545" y="437" font-size="10" fill="#c62828">⑥ 條件不成立，維持 IDLE，什麼都不做</text>

  <!-- Tick #2 -->
  <text x="700" y="490" font-size="11" fill="#90a4ae" text-anchor="middle">━━━━ tick #2（下一次呼叫，同一個 self.rule 物件被再問一次）━━━━</text>
  <text x="60" y="520" font-size="11.5" font-weight="700" fill="#c62828">tick #2</text>

  <path d="M170,535 L540,535" stroke="#37474f" stroke-width="1.5" marker-end="url(#call)" />
  <text x="180" y="528" font-size="10.5" fill="#37474f">⑦ runner.tick(now+Δt, price′)</text>

  <rect x="540" y="550" width="260" height="26" rx="4" fill="#fff5f5" stroke="#ef9a9a" />
  <text x="545" y="567" font-size="10" fill="#c62828">⑧ 組出全新的 ctx（不是複用上一個）</text>

  <path d="M540,595 L890,595" stroke="#7e57c2" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dot)" />
  <path d="M890,615 L1230,615" stroke="#37474f" stroke-width="1.5" marker-end="url(#call)" />
  <text x="940" y="608" font-size="10" fill="#37474f">⑨ entry.rule.evaluate(ctx)　同一個 rule 物件</text>

  <path d="M1230,645 L540,645" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ret)" />
  <text x="700" y="638" font-size="10" fill="#607d8b">⑩ return True</text>

  <path d="M540,675 L890,675" stroke="#37474f" stroke-width="1.5" marker-end="url(#call)" />
  <text x="600" y="668" font-size="10" fill="#37474f">⑪ entry.entry_price(ctx)</text>
  <path d="M890,695 L540,695" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ret)" />
  <text x="640" y="712" font-size="10" fill="#607d8b">⑫ return 990.0</text>

  <rect x="540" y="725" width="420" height="30" rx="4" fill="#fff5f5" stroke="#ef9a9a" />
  <text x="545" y="744" font-size="10" fill="#c62828">⑬ 狀態轉換 IDLE → ENTRY_PENDING，下限價單 990.0</text>

  <!-- Note box -->
  <rect x="60" y="800" width="1280" height="90" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5" />
  <text x="80" y="825" font-size="11.5" font-weight="700" fill="#e65100">關鍵：同一個 self.rule 物件，會被重複呼叫 evaluate() 很多次（每個 tick 一次）</text>
  <text x="80" y="847" font-size="10.5" fill="#ef6c00">— 對 5 個無狀態 condition（PriceBelowReference 等）來說，同樣的 ctx 進去結果不會變，純函式。</text>
  <text x="80" y="866" font-size="10.5" fill="#ef6c00">— 但 SustainedPriceBreakout 例外：它會在這些重複呼叫之間累積內部歷史，結果會隨著被呼叫的次數改變。</text>

  <!-- legend -->
  <g font-size="10.5" fill="#455a64">
    <line x1="60" y1="930" x2="100" y2="930" stroke="#37474f" stroke-width="1.5" marker-end="url(#call)" />
    <text x="108" y="934">方法呼叫</text>
    <line x1="220" y1="930" x2="260" y2="930" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ret)" />
    <text x="268" y="934">回傳值</text>
    <line x1="380" y1="930" x2="420" y2="930" stroke="#7e57c2" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dot)" />
    <text x="428" y="934">屬性存取（.rule）</text>
  </g>
</svg>
